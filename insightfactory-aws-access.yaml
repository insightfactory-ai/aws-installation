AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Insight Factory deployment access. Creates a GitHub Actions OIDC identity provider
  and one IAM role that Insight Factory's automation assumes to deploy and maintain
  the Insight Factory platform in this AWS account. No IAM users, no access keys and
  no long-lived credentials are created: every session is obtained by exchanging a
  short-lived, signed GitHub-issued token, from one repository and one branch, and
  only from Insight Factory's published CI addresses.

# ---------------------------------------------------------------------------------
# Deploy ONCE PER AWS ACCOUNT that will host Insight Factory resources, in the region
# the platform will run in. There is nothing to fill in.
#
#   aws cloudformation deploy \
#     --template-file insightfactory-aws-access.yaml \
#     --stack-name insightfactory-access \
#     --region <your-region> \
#     --capabilities CAPABILITY_NAMED_IAM
#
# Then send the Outputs back to Insight Factory.
#
# The platform uses one AWS account per environment: dev, test, prod, and one shared
# account. Deploy this stack once in each of those accounts.
#
# Everything this stack trusts is written into it: the repository and branch, the CI
# addresses, the session length, the policy names. None of it is a parameter, so none
# of it can drift between the file your security team reviewed and the stack you
# deployed. A change to any of it is a new version of this template.
#
# The three parameters that remain are the ones your own account and organisation
# decide rather than us. All three have working defaults, and the defaults are correct
# unless your organisation imposes a standard of its own.
# ---------------------------------------------------------------------------------

Parameters:
  # AWS account state decides this one, not you. An account holds one entry per
  # identity provider; if something else here already trusts
  # token.actions.githubusercontent.com, creating a second fails as a duplicate.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['Yes', 'No']
    Default: 'Yes'
    Description: >-
      Leave as Yes. Set to No only if this AWS account already trusts
      https://token.actions.githubusercontent.com from an earlier stack.

  # And your organisation decides this one. It is a parameter rather than a fixed
  # value because IAM naming standards are commonly enforced by an SCP, and a stack
  # that cannot honour yours is a stack you cannot deploy at all.
  IamPath:
    Type: String
    Default: /insightfactory/
    AllowedPattern: '^/([A-Za-z0-9_.,+@=-]+/)+$'
    ConstraintDescription: >-
      IamPath must begin and end with / and contain at least one segment, for example
      /insightfactory/ or /company/vendors/insightfactory/. A bare / is refused: it
      would make the guardrails below apply to every role in the account rather than
      to ours, which reads like a tightening and is the opposite.
    Description: >-
      The IAM path under which every role and group the deployment creates is placed.
      It grants nothing by itself: it is what lets the guardrails below say "only under
      here" instead of "anywhere in this account". Leave it as supplied unless your
      naming standard requires otherwise - and if you change it, tell Insight Factory,
      because the deployment must be configured with the same value or it will be
      denied by its own guardrails on the first apply.

  # And so does this one. Some organisations require a permissions boundary on every
  # IAM principal, enforced by an SCP that refuses CreateRole without one. Without
  # this parameter such an account cannot deploy the stack at all, and the failure is
  # a generic SCP denial that does not say why.
  #
  # Note this is a boundary YOU place on IFTerraform. It is not IFTerraformBoundary,
  # which is the ceiling this stack places on the roles IFTerraform later creates.
  # Both can be set; they do not interact.
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-zA-Z-]*:iam::([0-9]{12}|aws):policy/.+)?$'
    ConstraintDescription: >-
      Leave empty, or supply the full ARN of an IAM managed policy - your own, for
      example arn:aws:iam::123456789012:policy/OrgBoundary, or an AWS-managed one.
    Description: >-
      Optional. If your organisation requires a permissions boundary on IAM principals,
      supply its ARN and it is applied to IFTerraform. Tell Insight Factory if you set
      it: your boundary intersects with everything the role is granted, so one narrower
      than the platform needs fails the deployment part-way through, with resources
      already created.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, 'Yes']
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Resources:

  # -------------------------------------------------------------------------------
  # GitHub as an OIDC identity provider.
  #
  # ThumbprintList is deliberately omitted. AWS validates GitHub's tokens against its
  # own library of trusted root CAs, so a pinned thumbprint is both unnecessary and a
  # future outage when GitHub rotates certificates.
  # -------------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - { Key: ManagedBy, Value: InsightFactory }

  # -------------------------------------------------------------------------------
  # The single role Insight Factory's automation assumes. It both maintains the
  # platform infrastructure and publishes application releases into it, the same
  # arrangement as the single Insight Factory DevOps service principal used in Azure
  # deployments. Both run from the one release repository named in the trust policy;
  # application code repositories have no path into this account.
  # -------------------------------------------------------------------------------
  InsightFactoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: IFTerraform
      Description: Assumed by Insight Factory GitHub Actions to deploy and maintain the Insight Factory platform.
      # Four hours. A first deployment builds a VPC with a NAT gateway, a database and
      # a Databricks workspace in one run and can take longer than an hour, and a
      # session cannot renew itself part way through: one that expires leaves the
      # deployment half applied.
      MaxSessionDuration: 14400
      # Absent entirely unless PermissionsBoundaryArn was supplied. Yours, on this
      # role - not IFTerraformBoundary, which is ours, on the roles this one creates.
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      ManagedPolicyArns:
        - !Ref IFTerraformDeployPolicy

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # aud pins the token to one minted for AWS specifically, so a token
                # GitHub issued for any other service cannot be replayed here.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # sub pins it to one repository and one branch, matched exactly, not
                # by pattern. The organisation and the repository appear as numbers
                # because that is the form GitHub issues: a name can be given up and
                # claimed by someone else, an id cannot.
                token.actions.githubusercontent.com:sub: 'repo:insightfactory-ai@76498963/if_sre_github_releases@1307263479:ref:refs/heads/main'
              # And only from Insight Factory's release pipelines. These are static
              # egress addresses: two in the primary region, two in the failover
              # region. The condition is on the assumption call, not on the role's
              # permissions - see note 4 at the end.
              IpAddress:
                aws:SourceIp:
                  - 192.240.244.134/32   # primary   (us-west)
                  - 192.240.244.165/32   # primary   (us-west)
                  - 152.236.40.73/32     # failover  (us-east)
                  - 152.236.40.227/32    # failover  (us-east)

      # -------------------------------------------------------------------------
      # Guardrails.
      #
      # These are explicit denies, and in AWS an explicit deny beats every allow, so
      # they bound this role whatever policy is attached to it now or later. The
      # answer to "what can Insight Factory do here" is this section first and the
      # attached policy second.
      # -------------------------------------------------------------------------
      Policies:
        - PolicyName: IFTerraformGuardrails
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # 1. Identities: only its own. Everything the deployment creates lives
              # under IamPath, so denying these actions anywhere else means
              # the role cannot read, alter or delete an identity it did not create -
              # including editing its own trust policy to widen who may assume it.
              # PassRole is in this list deliberately: without it the role could hand
              # one of your existing privileged roles to a function it creates, and
              # inherit that privilege through it.
              - Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:CreateGroup
                  - iam:DeleteGroup
                  - iam:UpdateGroup
                  - iam:PutGroupPolicy
                  - iam:DeleteGroupPolicy
                  - iam:AttachGroupPolicy
                  - iam:DetachGroupPolicy
                  - iam:AddUserToGroup
                  - iam:RemoveUserFromGroup
                NotResource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:group${IamPath}*'

              # 2. Every role it creates must carry the boundary below. Statement 1
              # alone would still allow a role under our own path with
              # AdministratorAccess attached, which would make the path decoration.
              - Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                Resource: '*'
                Condition:
                  StringNotEquals:
                    iam:PermissionsBoundary: !Ref IFTerraformBoundary

              # 3. And it cannot take the boundary back off once set.
              - Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'

              # 4. And it cannot rewrite the boundary itself. Without this the whole
              # arrangement is decorative - the role would publish a new default
              # version of the policy that caps it. This is the statement that makes
              # the two above mean anything.
              - Effect: Deny
                Action:
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:DeletePolicy
                Resource: !Ref IFTerraformBoundary

              # 5. Account-level controls are yours alone. The role builds and
              # operates a platform; it has no business in your organisation, your
              # bill, or the audit trail that makes everything above verifiable. The
              # IAM user and access-key denies are here so that "no users, no keys" is
              # a property your account enforces, not a claim we make.
              - Effect: Deny
                Action:
                  - organizations:*
                  - account:*
                  - aws-portal:*
                  - ce:*
                  - budgets:*
                  - cloudtrail:StopLogging
                  - cloudtrail:DeleteTrail
                  - cloudtrail:UpdateTrail
                  - cloudtrail:PutEventSelectors
                  - guardduty:DeleteDetector
                  - guardduty:UpdateDetector
                  - guardduty:DisassociateFromMasterAccount
                  - securityhub:DisableSecurityHub
                  - securityhub:DeleteMembers
                  - config:DeleteConfigRule
                  - config:DeleteConfigurationRecorder
                  - config:StopConfigurationRecorder
                  - iam:CreateUser
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                  - iam:CreateSAMLProvider
                  - iam:DeleteSAMLProvider
                  - iam:UpdateAccountPasswordPolicy
                  - iam:DeleteAccountPasswordPolicy
                Resource: '*'
      Tags:
        - { Key: ManagedBy, Value: InsightFactory }

  # -------------------------------------------------------------------------------
  # What the role may do.
  #
  # Sixteen services, and nothing else in AWS. The platform is storage, serverless
  # compute, data processing, two database engines, caching, notifications,
  # scheduling, logging and inference - so those are the services here, and the couple
  # of hundred others are simply absent.
  #
  # The grants are at service level rather than enumerated action lists. These
  # accounts hold nothing but the Insight Factory platform, so a narrower list would
  # mean you approving a change every time the platform called a new API, without
  # meaningfully changing what is reachable.
  #
  # iam:* is here because the deployment creates and maintains the roughly fifteen
  # roles its own services run under. What stops that being unlimited is not this
  # policy but the guardrails on the role above, which deny every mutating IAM action
  # outside IamPath, refuse to create a role without the boundary, and refuse
  # to let the boundary be removed or rewritten. Read those first: an explicit deny
  # overrides any allow here.
  # -------------------------------------------------------------------------------
  IFTerraformDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformDeploy
      Description: >-
        Services the Insight Factory deployment uses. Attached to IFTerraform and
        bounded by that role's inline guardrails.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:*
              - s3:*
              - kms:*
              - secretsmanager:*
              - lambda:*
              - glue:*
              - rds:*
              - rds-db:connect
              - elasticache:*
              - sns:*
              - scheduler:*
              - logs:*
              - cloudwatch:*
              - xray:*
              - bedrock:*
              - iam:*
              - sts:*
              - tag:GetResources
              - tag:TagResources
              - tag:UntagResources
            Resource: '*'

  # -------------------------------------------------------------------------------
  # The ceiling on every role the deployment creates.
  #
  # A permissions boundary is not a grant. A role's effective permissions are the
  # intersection of what it is granted and what this policy permits, so this is the
  # complete answer to "what is the most any Insight Factory role in my account can
  # ever do" - roughly fifteen roles per account, none of which can exceed it,
  # whatever policy is attached to them. Statement 2 of the guardrails above refuses
  # to create a role without it.
  #
  # Service level again, for the same reason. What prevents privilege escalation here
  # is the absence of iam from the list, not the precision of the entries in it.
  # -------------------------------------------------------------------------------
  IFTerraformBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformBoundary
      Description: >-
        Ceiling for every IAM role the Insight Factory deployment creates in this
        account. No such role can exceed this policy, whatever is attached to it.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # What the platform's roles do at runtime: storage, serverless compute, data
          # processing, the databases, caching, notifications, scheduling, logging and
          # tracing.
          - Effect: Allow
            Action:
              - ec2:*
              - s3:*
              - lambda:*
              - glue:*
              - rds:*
              - rds-db:connect
              - elasticache:*
              - secretsmanager:*
              - sns:*
              - scheduler:*
              - logs:*
              - cloudwatch:*
              - xray:*
            Resource: '*'

          # KMS is narrower on purpose. Key deletion and key-policy changes are
          # irreversible, and would reach a key you supplied rather than one we
          # created, so the ceiling covers only the operations the platform performs.
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RetireGrant
            Resource: '*'

          # Only if you enabled Bedrock, and only inference.
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource: '*'

          # The Databricks integration requires several of these roles to assume
          # themselves. Confined to the path, so no boundaried role can assume
          # anything of yours even if something granted it permission to try.
          - Effect: Allow
            Action:
              - sts:AssumeRole
              - iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'

          # Databricks spot instances need the EC2 spot service-linked role, which AWS
          # creates on first use. It is the only IAM write inside this ceiling, and the
          # condition means it can only ever produce that one AWS-managed role.
          - Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringLike:
                iam:AWSServiceName: spot.amazonaws.com

          # Belt and braces. A boundary is an allow-list, so everything absent from the
          # statements above is already capped out; these are written explicitly
          # because they are the ones a reviewer looks for.
          - Effect: Deny
            Action:
              - organizations:*
              - account:*
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - guardduty:*
              - securityhub:*
              - config:Delete*
              - config:Stop*
            Resource: '*'

Outputs:
  AwsAccountId:
    Description: Send to Insight Factory.
    Value: !Ref AWS::AccountId
  Region:
    Description: Region this stack was deployed in. Send to Insight Factory.
    Value: !Ref AWS::Region
  RoleArn:
    Description: Send to Insight Factory. The role its automation will assume.
    Value: !GetAtt InsightFactoryRole.Arn
  OidcProviderArn:
    Condition: MakeOidcProvider
    Description: The GitHub identity provider this stack created.
    Value: !Ref GitHubOidcProvider
  DeployPolicyArn:
    Description: >-
      The policy attached to IFTerraform. Read it for the full list of services the
      role can reach. Not something you need to send us.
    Value: !Ref IFTerraformDeployPolicy
  IamPath:
    Description: >-
      The path the deployment's roles and groups are confined to. Send it to Insight
      Factory only if you changed it from the default; the deployment must be
      configured with the same value.
    Value: !Ref IamPath
  BoundaryPolicyArn:
    Description: >-
      The ceiling this stack created for every role the deployment makes. Read it if
      you want to know the most any Insight Factory role here can do. Not something
      you need to send us.
    Value: !Ref IFTerraformBoundary

# ---------------------------------------------------------------------------------
# SCOPING NOTES for a security review
#
# 1. No credential to steal. The role is assumable only by presenting a token signed
#    by GitHub whose claims match the trust policy above, from one of four addresses.
#    Nothing is shared between the two organisations that could be copied, leaked or
#    replayed: no password, no access key, no shared secret.
#
# 2. Why the role needs IAM write access, and what stops that being unlimited. The
#    platform's serverless functions, data-processing jobs, database authentication
#    and Databricks integration all run under IAM roles the deployment creates and
#    maintains, roughly fifteen per environment. Anything able to create a role and
#    attach a policy to it could otherwise create an administrator and assume it, so
#    three controls sit on top of that ability: the roles are confined to IamPath,
#    each must carry the IFTerraformBoundary ceiling, and the role
#    cannot edit that ceiling. Read the Policies block on IFTerraformRole and the
#    boundary policy itself - between them they are the answer to this question.
#
#    PermissionsBoundaryArn is a separate thing: a boundary your own organisation
#    puts on IFTerraform. IFTerraformBoundary is the ceiling we put on the roles
#    IFTerraform creates. Both can be set, and they do not interact.
#
# 3. Services the role can reach. Read IFTerraformDeployPolicy: ec2, s3, kms,
#    secretsmanager, lambda, glue, rds, elasticache, sns, scheduler, logs, cloudwatch,
#    xray, bedrock, iam, sts and the tagging API. Nothing else in AWS is reachable at
#    all. The list is derived from the resource types the deployment declares rather
#    than from a completed deployment's CloudTrail, so it may prove very slightly
#    incomplete on a first install - the failure mode is an AccessDenied part-way
#    through an apply, not a silent gap. There is no parameter to widen it with: tell
#    us what failed and we will issue a corrected version of this template, so the
#    change is reviewable and recorded rather than made once in your account.
#
# 4. On the source-IP condition. It sits on the role-assumption call rather than on
#    the role's permissions. That is deliberate: an IP condition on the permissions
#    would also be evaluated when an AWS service makes a follow-on call on the role's
#    behalf, where the caller's IP is not part of the request context, and legitimate
#    operations would fail in ways that are hard to diagnose. Restricting the
#    assumption is sufficient - no session can be obtained from anywhere else in the
#    first place.
#
#    The four addresses are the static egress of Insight Factory's release pipelines,
#    two per region, the second region being failover. They identify "an Insight
#    Factory CI job"; the repository and branch claim identifies the pipeline. The two
#    are independent layers and neither replaces the other. If these addresses ever
#    change, that is a new version of this template and a stack update for you - which
#    is the point: our CI cannot move without you seeing it.
#
# 5. One role or two. This template creates one role, matching the single deployment
#    identity used in Azure deployments. If you would prefer the application release
#    pipelines to hold a separate, much narrower role - able to update function code
#    and data-processing job definitions but not to create infrastructure - Insight
#    Factory can supply that variant. It is a larger task list for you, not a smaller
#    one, which is why it is not the default.
#
# 6. Revoking access. Delete this stack. Every session the automation could obtain
#    disappears with the role, and there is no credential that outlives it. To suspend
#    access without deleting, edit the sub condition on the role's trust policy - a
#    change only you can make, and one we cannot undo from our side.
# ---------------------------------------------------------------------------------
