AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Insight Factory deployment access. Creates a GitHub Actions OIDC identity provider
  and one IAM role that Insight Factory's automation assumes to deploy and maintain
  the Insight Factory platform in this AWS account. No IAM users, no access keys and
  no long-lived credentials are created: every session is obtained by exchanging a
  short-lived, signed GitHub-issued token, from one repository and one branch, and
  only from Insight Factory's published CI addresses.

# ---------------------------------------------------------------------------------
# Deploy ONCE PER AWS ACCOUNT that will host Insight Factory resources, in the region
# the platform will run in. There is nothing to fill in.
#
#   aws cloudformation deploy \
#     --template-file insightfactory-aws-access.yaml \
#     --stack-name insightfactory-access \
#     --region <your-region> \
#     --capabilities CAPABILITY_NAMED_IAM
#
# Then send the Outputs back to Insight Factory.
#
# The platform uses one AWS account per environment: dev, test, prod, and one shared
# account. Deploy this stack once in each of those accounts.
#
# Everything this stack trusts is written into it: the repository and branch, the CI
# addresses, the session length, the policy names. None of it is a parameter, so none
# of it can drift between the file your security team reviewed and the stack you
# deployed. A change to any of it is a new version of this template.
#
# The three parameters that remain are the ones your own account and organisation
# decide rather than us. All three have working defaults, and the defaults are correct
# unless your organisation imposes a standard of its own.
# ---------------------------------------------------------------------------------

Parameters:
  # AWS account state decides this one, not you. An account holds one entry per
  # identity provider; if something else here already trusts
  # token.actions.githubusercontent.com, creating a second fails as a duplicate.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['Yes', 'No']
    Default: 'Yes'
    Description: >-
      Leave as Yes. Set to No only if this AWS account already trusts
      https://token.actions.githubusercontent.com from an earlier stack.

  # And your organisation decides this one. It is a parameter rather than a fixed
  # value because IAM naming standards are commonly enforced by an SCP, and a stack
  # that cannot honour yours is a stack you cannot deploy at all.
  IamPath:
    Type: String
    Default: /insightfactory/
    AllowedPattern: '^/([A-Za-z0-9_.,+@=-]+/)+$'
    ConstraintDescription: >-
      IamPath must begin and end with / and contain at least one segment, for example
      /insightfactory/ or /company/vendors/insightfactory/. A bare / is refused: it
      would put our roles at the account root, where the policies below could no longer
      tell ours apart from yours.
    Description: >-
      The IAM path under which every role and group the deployment creates is placed.
      It grants nothing by itself: it is what lets the policies below say "only under
      here" instead of "anywhere in this account". Leave it as supplied unless your
      naming standard requires otherwise - and if you change it, tell Insight Factory,
      because the deployment must be configured with the same value or its first apply
      is denied.

  # And so does this one. Some organisations require a permissions boundary on every
  # IAM principal, enforced by an SCP that refuses CreateRole without one. Without
  # this parameter such an account cannot deploy the stack at all, and the failure is
  # a generic SCP denial that does not say why.
  #
  # Note this is a boundary YOU place on IFTerraform. It is not IFTerraformBoundary,
  # which is the ceiling this stack places on the roles IFTerraform later creates.
  # Both can be set; they do not interact.
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-zA-Z-]*:iam::([0-9]{12}|aws):policy/.+)?$'
    ConstraintDescription: >-
      Leave empty, or supply the full ARN of an IAM managed policy - your own, for
      example arn:aws:iam::123456789012:policy/OrgBoundary, or an AWS-managed one.
    Description: >-
      Optional. If your organisation requires a permissions boundary on IAM principals,
      supply its ARN and it is applied to IFTerraform. Tell Insight Factory if you set
      it: your boundary intersects with everything the role is granted, so one narrower
      than the platform needs fails the deployment part-way through, with resources
      already created.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, 'Yes']
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Resources:

  # -------------------------------------------------------------------------------
  # GitHub as an OIDC identity provider.
  #
  # ThumbprintList is deliberately omitted. AWS validates GitHub's tokens against its
  # own library of trusted root CAs, so a pinned thumbprint is both unnecessary and a
  # future outage when GitHub rotates certificates.
  # -------------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - { Key: ManagedBy, Value: InsightFactory }

  # -------------------------------------------------------------------------------
  # The single role Insight Factory's automation assumes. It both maintains the
  # platform infrastructure and publishes application releases into it, the same
  # arrangement as the single Insight Factory DevOps service principal used in Azure
  # deployments. Both run from the one release repository named in the trust policy;
  # application code repositories have no path into this account.
  # -------------------------------------------------------------------------------
  InsightFactoryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: IFTerraform
      Description: Assumed by Insight Factory GitHub Actions to deploy and maintain the Insight Factory platform.
      # Four hours. A first deployment builds a VPC with a NAT gateway, a database and
      # a Databricks workspace in one run and can take longer than an hour, and a
      # session cannot renew itself part way through: one that expires leaves the
      # deployment half applied.
      MaxSessionDuration: 14400
      # Absent entirely unless PermissionsBoundaryArn was supplied. Yours, on this
      # role - not IFTerraformBoundary, which is ours, on the roles this one creates.
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      ManagedPolicyArns:
        - !Ref IFTerraformDeployIam
        - !Ref IFTerraformDeployNetwork
        - !Ref IFTerraformDeployData
        - !Ref IFTerraformDeployCompute

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # aud pins the token to one minted for AWS specifically, so a token
                # GitHub issued for any other service cannot be replayed here.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # sub pins it to one repository and one branch, matched exactly, not
                # by pattern. Nothing else on GitHub can obtain a session.
                #
                # The organisation and the repository appear as numbers rather than
                # names - 76498963 is insightfactory-ai, 1307263479 is
                # if_sre_github_releases. That is the form GitHub issues for this
                # repository, and it is the stronger of the two: a name can be given
                # up and claimed by someone else, an id cannot, so a repository
                # renamed to ours afterwards still would not match.
                #
                # The name-based spelling is deliberately absent. Accepting both would
                # mean accepting a value that can change hands.
                token.actions.githubusercontent.com:sub: 'repo:insightfactory-ai@76498963/if_sre_github_releases@1307263479:ref:refs/heads/main'
              # And only from Insight Factory's release pipelines. These are static
              # egress addresses: two in the primary region, two in the failover
              # region. The condition is on the assumption call, not on the role's
              # permissions - see note 4 at the end.
              IpAddress:
                aws:SourceIp:
                  - 192.240.244.134/32   # primary   (us-west)
                  - 192.240.244.165/32   # primary   (us-west)
                  - 152.236.40.73/32     # failover  (us-east)
                  - 152.236.40.227/32    # failover  (us-east)

      Tags:
        - { Key: ManagedBy, Value: InsightFactory }

  # -------------------------------------------------------------------------------
  # What the role may do.
  #
  # Enumerated actions, not service wildcards. 342 actions, each named in full, with no
  # asterisk anywhere in the four policies. The list is derived from the resource types
  # the deployment declares and checked against CloudTrail from live installations. A
  # first install may still meet an AccessDenied on an API neither source showed, which
  # is corrected by a new version of this template rather than by widening it in your
  # account.
  #
  # Four policies because one would exceed the 6,144 character limit on a managed
  # policy. Split by job so each can be read on its own.
  #
  # Scoping is by resource ARN where the deployment's naming makes it exact, and by
  # condition where it does not. iam:CreateRole carries the boundary requirement as a
  # condition on the grant itself, so a role cannot be created without it.
  # -------------------------------------------------------------------------------
  IFTerraformDeployIam:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformDeployIam
      Description: >-
        The IAM objects the deployment creates, confined to IamPath. It cannot reach the
        policies that bound it: those sit at the account root, outside this scope.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateRoleOnlyWithOurBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref IFTerraformBoundary
          - Sid: ManageOurRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:ListRolePolicies
              - iam:ListRoleTags
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'
          - Sid: AttachOnlyOurOwnOrNamedAwsPolicies
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'
            Condition:
              ArnLike:
                iam:PolicyARN:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy${IamPath}*'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess'
          - Sid: PassOurRolesOnlyToTheServicesThatRunThem
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - glue.amazonaws.com
                  - scheduler.amazonaws.com
                  - rds.amazonaws.com
                  - ecs-tasks.amazonaws.com
                  - ecs.amazonaws.com
          - Sid: ManageOurGroups
            Effect: Allow
            Action:
              - iam:CreateGroup
              - iam:DeleteGroup
              - iam:DeleteGroupPolicy
              - iam:GetGroup
              - iam:GetGroupPolicy
              - iam:ListGroupPolicies
              - iam:PutGroupPolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:group${IamPath}*'
          - Sid: ManageMembershipOfOurGroups
            Effect: Allow
            Action:
              - iam:AddUserToGroup
              - iam:RemoveUserFromGroup
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:group${IamPath}*'
          - Sid: ManageOurCustomerManagedPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListEntitiesForPolicy
              - iam:ListPolicyVersions
              - iam:TagPolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy${IamPath}*'
          - Sid: AttachOnlyOurOwnPoliciesToAUser
            Effect: Allow
            Action:
              - iam:AttachUserPolicy
              - iam:DetachUserPolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*'
            Condition:
              ArnLike:
                iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy${IamPath}*'
          - Sid: ManageTheEntraAndGitHubProviders
            Effect: Allow
            Action:
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:GetOpenIDConnectProvider
              - iam:TagOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/*'
          - Sid: ServiceLinkedRolesForSpotAndEcs
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - spot.amazonaws.com
                  - ecs.amazonaws.com
          - Sid: ReadIamForPlan
            Effect: Allow
            Action:
              - iam:GetGroup
              - iam:GetOpenIDConnectProvider
              - iam:GetPolicy
              - iam:GetRole
              - iam:ListGroups
              - iam:ListOpenIDConnectProviders
              - iam:ListPolicies
              - iam:ListRoles
            Resource: '*'

  IFTerraformDeployNetwork:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformDeployNetwork
      Description: >-
        The VPC the platform runs in: subnets, routing, NAT, endpoints and security groups.
        No instance, image or snapshot action is present.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadNetworkForPlan
            Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAddressesAttribute
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeNatGateways
              - ec2:DescribeNetworkAcls
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribePrefixLists
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroupRules
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcAttribute
              - ec2:DescribeVpcEndpoints
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeVpcs
            Resource: '*'
          - Sid: BuildTheVpc
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:AssociateRouteTable
              - ec2:AttachInternetGateway
              - ec2:CreateInternetGateway
              - ec2:CreateNatGateway
              - ec2:CreateRoute
              - ec2:CreateRouteTable
              - ec2:CreateSubnet
              - ec2:CreateTags
              - ec2:CreateVpc
              - ec2:CreateVpcEndpoint
              - ec2:DeleteInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteRoute
              - ec2:DeleteRouteTable
              - ec2:DeleteSubnet
              - ec2:DeleteTags
              - ec2:DeleteVpc
              - ec2:DeleteVpcEndpoints
              - ec2:DetachInternetGateway
              - ec2:DisassociateRouteTable
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:ModifyVpcEndpoint
              - ec2:ReleaseAddress
              - ec2:ReplaceRoute
            Resource: '*'
          # A peering carries no traffic until a route table entry and a security group rule name the far side
          - Sid: PeerWithTheInsightFactoryNetwork
            Effect: Allow
            Action:
              - ec2:AcceptVpcPeeringConnection
              - ec2:CreateVpcPeeringConnection
              - ec2:DeleteVpcPeeringConnection
              - ec2:ModifyVpcPeeringConnectionOptions
              - ec2:RejectVpcPeeringConnection
            Resource: '*'
          - Sid: ManageSecurityGroups
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:ModifySecurityGroupRules
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:UpdateSecurityGroupRuleDescriptionsEgress
              - ec2:UpdateSecurityGroupRuleDescriptionsIngress
            Resource: '*'

  IFTerraformDeployData:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformDeployData
      Description: >-
        Storage, keys, secrets, databases and the data catalog.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Buckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:GetAccelerateConfiguration
              - s3:GetBucketAcl
              - s3:GetBucketCORS
              - s3:GetBucketLocation
              - s3:GetBucketLogging
              - s3:GetBucketNotification
              - s3:GetBucketOwnershipControls
              - s3:GetBucketObjectLockConfiguration
              - s3:GetBucketPolicy
              - s3:GetBucketPublicAccessBlock
              - s3:GetBucketRequestPayment
              - s3:GetBucketTagging
              - s3:GetBucketVersioning
              - s3:GetBucketWebsite
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetObject
              - s3:GetObjectTagging
              - s3:GetReplicationConfiguration
              - s3:ListAllMyBuckets
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:ListTagsForResource
              - s3:PutBucketOwnershipControls
              - s3:PutBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketTagging
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
              - s3:PutObject
            Resource: '*'
          - Sid: EnvironmentKeys
            Effect: Allow
            Action:
              - kms:CancelKeyDeletion
              - kms:CreateAlias
              - kms:CreateGrant
              - kms:CreateKey
              - kms:Decrypt
              - kms:DeleteAlias
              - kms:DescribeKey
              - kms:DisableKeyRotation
              - kms:EnableKeyRotation
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:RetireGrant
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateAlias
            Resource: '*'
          - Sid: ListSecrets
            Effect: Allow
            Action: secretsmanager:ListSecrets
            Resource: '*'
          - Sid: OurSecretsOnly
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetResourcePolicy
              - secretsmanager:GetSecretValue
              - secretsmanager:ListSecretVersionIds
              - secretsmanager:PutSecretValue
              - secretsmanager:RestoreSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:UpdateSecret
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*'
          - Sid: Databases
            Effect: Allow
            Action:
              - rds:AddTagsToResource
              - rds:CreateDBInstance
              - rds:CreateDBParameterGroup
              - rds:CreateDBSnapshot
              - rds:CreateDBSubnetGroup
              - rds:DeleteDBInstance
              - rds:DeleteDBParameterGroup
              - rds:DeleteDBSnapshot
              - rds:DeleteDBSubnetGroup
              - rds:DescribeDBEngineVersions
              - rds:DescribeDBInstances
              - rds:DescribeDBParameterGroups
              - rds:DescribeDBParameters
              - rds:DescribeDBSnapshots
              - rds:DescribeDBSubnetGroups
              - rds:DescribeOrderableDBInstanceOptions
              - rds:ListTagsForResource
              - rds:ModifyDBInstance
              - rds:ModifyDBParameterGroup
              - rds:ModifyDBSubnetGroup
              - rds:RemoveTagsFromResource
            Resource: '*'
          - Sid: ConnectAsTheDeployRoleOnly
            Effect: Allow
            Action: rds-db:connect
            Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/control_admin'
          - Sid: Redis
            Effect: Allow
            Action:
              - elasticache:AddTagsToResource
              - elasticache:CreateCacheSubnetGroup
              - elasticache:CreateReplicationGroup
              - elasticache:DeleteCacheSubnetGroup
              - elasticache:DeleteReplicationGroup
              - elasticache:DescribeCacheClusters
              - elasticache:DescribeCacheSubnetGroups
              - elasticache:DescribeReplicationGroups
              - elasticache:ListTagsForResource
              - elasticache:ModifyCacheSubnetGroup
              - elasticache:ModifyReplicationGroup
              - elasticache:RemoveTagsFromResource
            Resource: '*'
          - Sid: GlueCatalogAndConnections
            Effect: Allow
            Action:
              - glue:CreateConnection
              - glue:CreateDatabase
              - glue:DeleteConnection
              - glue:DeleteDatabase
              - glue:GetConnection
              - glue:GetDatabase
              - glue:GetTags
              - glue:TagResource
              - glue:UntagResource
              - glue:UpdateConnection
              - glue:UpdateDatabase
            Resource: '*'

  IFTerraformDeployCompute:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformDeployCompute
      Description: >-
        Functions, containers, schedules, logs, alarms and notifications.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Functions
            Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:CreateFunction
              - lambda:CreateFunctionUrlConfig
              - lambda:DeleteFunction
              - lambda:DeleteFunctionConcurrency
              - lambda:DeleteFunctionEventInvokeConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:GetFunction
              - lambda:GetFunctionCodeSigningConfig
              - lambda:GetFunctionConcurrency
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionEventInvokeConfig
              - lambda:GetFunctionUrlConfig
              - lambda:GetPolicy
              - lambda:ListDurableExecutionsByFunction
              - lambda:ListTags
              - lambda:ListVersionsByFunction
              - lambda:PutFunctionConcurrency
              - lambda:PutFunctionEventInvokeConfig
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:UpdateFunctionEventInvokeConfig
              - lambda:UpdateFunctionUrlConfig
            Resource: '*'
          - Sid: Schedules
            Effect: Allow
            Action:
              - scheduler:CreateSchedule
              - scheduler:DeleteSchedule
              - scheduler:GetSchedule
              - scheduler:ListTagsForResource
              - scheduler:TagResource
              - scheduler:UntagResource
              - scheduler:UpdateSchedule
            Resource: '*'
          - Sid: LogsAndAlarms
            Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:ListTagsForResource
              - cloudwatch:PutMetricAlarm
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - logs:AssociateKmsKey
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DeleteRetentionPolicy
              - logs:DescribeLogGroups
              - logs:DisassociateKmsKey
              - logs:ListTagsForResource
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource: '*'
          - Sid: Alerting
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetSubscriptionAttributes
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:ListTagsForResource
              - sns:ListTopics
              - sns:SetSubscriptionAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:TagResource
              - sns:Unsubscribe
              - sns:UntagResource
            Resource: '*'
          - Sid: ContainerImages
            Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteLifecyclePolicy
              - ecr:DeleteRepository
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:GetLifecyclePolicy
              - ecr:GetRepositoryPolicy
              - ecr:ListTagsForResource
              - ecr:PutImageScanningConfiguration
              - ecr:PutImageTagMutability
              - ecr:PutLifecyclePolicy
              - ecr:SetRepositoryPolicy
              - ecr:TagResource
              - ecr:UntagResource
            Resource: '*'
          - Sid: AgentAppServices
            Effect: Allow
            Action:
              - acm:AddTagsToCertificate
              - acm:DeleteCertificate
              - acm:DescribeCertificate
              - acm:GetCertificate
              - acm:ListCertificates
              - acm:ListTagsForCertificate
              - acm:RemoveTagsFromCertificate
              - acm:RequestCertificate
              - ecs:CreateCluster
              - ecs:CreateService
              - ecs:DeleteCluster
              - ecs:DeleteService
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeClusters
              - ecs:DescribeServices
              - ecs:DescribeTaskDefinition
              - ecs:ListTagsForResource
              - ecs:RegisterTaskDefinition
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:UpdateCluster
              - ecs:UpdateClusterSettings
              - ecs:UpdateService
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:DescribeListenerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:ModifyListenerAttributes
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:RemoveTags
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
            Resource: '*'
          - Sid: WhoAmI
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'

  IFTerraformBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IFTerraformBoundary
      Description: >-
        Ceiling for every IAM role the Insight Factory deployment creates in this
        account. No such role can exceed this policy, whatever is attached to it.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # What the platform's roles do at runtime: storage, serverless compute,
          # container orchestration, data processing, the databases, caching,
          # notifications, scheduling, logging and tracing.
          - Effect: Allow
            Action:
              - ec2:*
              - ecr:*
              - ecs:*
              - application-autoscaling:*
              - s3:*
              - lambda:*
              - glue:*
              - rds:*
              - rds-db:connect
              - elasticache:*
              - secretsmanager:*
              - sns:*
              - scheduler:*
              - logs:*
              - cloudwatch:*
              - xray:*
            Resource: '*'

          # KMS is narrower on purpose. Key deletion and key-policy changes are
          # irreversible, and would reach a key you supplied rather than one we
          # created, so the ceiling covers only the operations the platform performs.
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RetireGrant
            Resource: '*'

          # Only if you enabled Bedrock, and only inference.
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource: '*'

          # The Databricks integration requires several of these roles to assume
          # themselves. Confined to the path, so no boundaried role can assume
          # anything of yours even if something granted it permission to try.
          - Effect: Allow
            Action:
              - sts:AssumeRole
              - iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role${IamPath}*'

          # Databricks spot instances need the EC2 spot service-linked role, and
          # Application Auto Scaling needs its own service-linked role the first time
          # it scales an ECS service. Both are AWS-managed roles created on first use.
          # It is the only IAM write inside this ceiling, and the condition means it
          # can only ever produce those two roles.
          - Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringLike:
                iam:AWSServiceName:
                  - spot.amazonaws.com
                  - ecs.application-autoscaling.amazonaws.com

          # Belt and braces. A boundary is an allow-list, so everything absent from the
          # statements above is already capped out; these are written explicitly
          # because they are the ones a reviewer looks for.
          - Effect: Deny
            Action:
              - organizations:*
              - account:*
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - guardduty:*
              - securityhub:*
              - config:Delete*
              - config:Stop*
            Resource: '*'

Outputs:
  AwsAccountId:
    Description: Send to Insight Factory.
    Value: !Ref AWS::AccountId
  Region:
    Description: Region this stack was deployed in. Send to Insight Factory.
    Value: !Ref AWS::Region
  RoleArn:
    Description: Send to Insight Factory. The role its automation will assume.
    Value: !GetAtt InsightFactoryRole.Arn
  OidcProviderArn:
    Condition: MakeOidcProvider
    Description: The GitHub identity provider this stack created.
    Value: !Ref GitHubOidcProvider
  DeployPolicyArns:
    Description: >-
      The four policies attached to IFTerraform, split by job. Read them for the exact
      list of actions the role can call. Not something you need to send us.
    Value: !Join
      - ', '
      - - !Ref IFTerraformDeployIam
        - !Ref IFTerraformDeployNetwork
        - !Ref IFTerraformDeployData
        - !Ref IFTerraformDeployCompute
  IamPath:
    Description: >-
      The path the deployment's roles and groups are confined to. Send it to Insight
      Factory only if you changed it from the default; the deployment must be
      configured with the same value.
    Value: !Ref IamPath
  BoundaryPolicyArn:
    Description: >-
      The ceiling this stack created for every role the deployment makes. Read it if
      you want to know the most any Insight Factory role here can do. Not something
      you need to send us.
    Value: !Ref IFTerraformBoundary

# ---------------------------------------------------------------------------------
# SCOPING NOTES for a security review
#
# 1. No credential to steal. The role is assumable only by presenting a token signed
#    by GitHub whose claims match the trust policy above, from one of four addresses.
#    Nothing is shared between the two organisations that could be copied, leaked or
#    replayed: no password, no access key, no shared secret.
#
# 2. Why the role needs IAM write access, and what stops that being unlimited. The
#    platform's serverless functions, data-processing jobs, database authentication
#    and Databricks integration all run under IAM roles the deployment creates and
#    maintains, roughly fifteen per environment. Anything able to create a role and
#    attach a policy to it could otherwise create an administrator and assume it, so
#    three conditions sit on the grant itself. iam:CreateRole is permitted only for a
#    role under IamPath and only when it carries the IFTerraformBoundary ceiling.
#    iam:AttachRolePolicy is permitted only for policies under IamPath and five named
#    AWS-managed ones. And the policies that bound the role, including the boundary,
#    are created at the account root, outside every scope granted here, so the role
#    cannot edit its own ceiling. Read IFTerraformDeployIam and the boundary policy.
#
#    PermissionsBoundaryArn is a separate thing: a boundary your own organisation
#    puts on IFTerraform. IFTerraformBoundary is the ceiling we put on the roles
#    IFTerraform creates. Both can be set, and they do not interact.
#
# 3. What the role can call. Read the four IFTerraformDeploy* policies. They list
#    individual actions rather than whole services, so the answer to "can it do X" is
#    a search rather than a judgement. The list is derived from the resource types the
#    deployment declares and checked against CloudTrail from live installations.
#    A first install may still meet an AccessDenied part-way through an apply if it
#    reaches an API neither source showed. There is no parameter to widen it with:
#    tell us what failed and we will issue a corrected version of this template, so
#    the change is reviewable and recorded rather than made once in your account.
#
# 4. What the role can still do that a condition cannot narrow. The deployment creates
#    two IAM groups for your people, gives each an inline policy, and can add a named
#    user to one. IAM has no condition key for the contents of an inline policy, and a
#    group cannot carry a permissions boundary, so those three actions are granted on
#    the path and bounded by nothing finer. They are scoped to groups under IamPath, so
#    the role cannot touch a group of yours outside it. Removing the human-access groups
#    from the deployment is the only thing that would remove this, and that is a product
#    decision rather than a policy one.
#
# 5. On the source-IP condition. It sits on the role-assumption call rather than on
#    the role's permissions. That is deliberate: an IP condition on the permissions
#    would also be evaluated when an AWS service makes a follow-on call on the role's
#    behalf, where the caller's IP is not part of the request context, and legitimate
#    operations would fail in ways that are hard to diagnose. Restricting the
#    assumption is sufficient - no session can be obtained from anywhere else in the
#    first place.
#
#    The four addresses are the static egress of Insight Factory's release pipelines,
#    two per region, the second region being failover. They identify "an Insight
#    Factory CI job"; the repository and branch claim identifies the pipeline. The two
#    are independent layers and neither replaces the other. If these addresses ever
#    change, that is a new version of this template and a stack update for you - which
#    is the point: our CI cannot move without you seeing it.
#
# 6. One role or two. This template creates one role, matching the single deployment
#    identity used in Azure deployments. If you would prefer the application release
#    pipelines to hold a separate, much narrower role - able to update function code
#    and data-processing job definitions but not to create infrastructure - Insight
#    Factory can supply that variant. It is a larger task list for you, not a smaller
#    one, which is why it is not the default.
#
# 7. Revoking access. Delete this stack. Every session the automation could obtain
#    disappears with the role, and there is no credential that outlives it. To suspend
#    access without deleting, edit the sub condition on the role's trust policy - a
#    change only you can make, and one we cannot undo from our side.
# ---------------------------------------------------------------------------------
